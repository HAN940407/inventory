<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>現場破損回報系統</title>
    <style>
        :root { --primary-color: #c0392b; --secondary-color: #e74c3c; --bg-color: #fdf2e9; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #34495e; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 6px; font-size: 1.1rem; box-sizing: border-box; text-align: center; letter-spacing: 2px; }
        .btn { width: 100%; padding: 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .btn:hover:not(:disabled) { filter: brightness(0.9); }
        .btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        
        #mainContainer { display: none; max-width: 600px; margin: 0 auto; padding-bottom: 50px;}
        .header { text-align: center; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 20px; outline:none;}
        
        .card { background: white; border-radius: 10px; padding: 15px; display: flex; gap: 15px; margin-bottom: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.05); align-items: center; border-left: 4px solid var(--secondary-color);}
        .card-img { width: 80px; height: 80px; border-radius: 8px; object-fit: cover; background: #eee; }
        .card-info { flex-grow: 1; }
        .sku { font-size: 0.8rem; color: #7f8c8d; }
        .name { font-size: 1.1rem; font-weight: bold; color: #333; margin: 3px 0; }
        .loc { font-size: 0.85rem; color: #d35400; background: #fdf2e9; padding: 2px 6px; border-radius: 4px; display: inline-block;}
        
        .audit-input-group { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
        .audit-input { width: 70px; padding: 8px; border: 2px solid var(--secondary-color); border-radius: 6px; font-size: 1.1rem; text-align: center; outline:none;}
        
        .broken-btn { padding: 8px 15px; background: var(--secondary-color); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; white-space: nowrap; transition: 0.3s;}
        .broken-btn:hover { background: var(--primary-color); }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:#e74c3c; margin-top:0;">💥 破損回報系統</h2>
        <input type="password" id="passwordInput" class="login-input" placeholder="員工授權碼">
        <button class="btn" id="loginBtn" onclick="checkPassword()">登入驗證</button>
        <p id="errorMsg" style="color:red; display:none; font-size:0.9rem; font-weight:bold;">密碼錯誤</p>
    </div>
</div>

<div id="mainContainer">
    <div class="header">
        <h2 style="color:var(--secondary-color); margin-bottom:5px;">💥 現場破損回報區</h2>
        <p style="color:#7f8c8d; font-size:0.9rem; margin-top:0;">回報後系統將自動為您扣除現場庫存</p>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋要回報的商品名稱、用途、編號...">
    </div>
    <div id="listContainer"></div>
</div>

<script>
    const API_URL = 'https://inventory-api.108m09101f.workers.dev'; 
    let inventoryData = [];

    async function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerText = "驗證中...";
        document.getElementById('errorMsg').style.display = 'none';

        try {
            const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Employee-Password': input }, body: JSON.stringify({ action: 'login_emp' }) });
            if (res.ok) { 
                sessionStorage.setItem('empToken', input); 
                btn.innerText = "下載資料中 📦..."; 
                await loadData(); 
            } else { 
                document.getElementById('errorMsg').style.display = 'block'; 
                btn.disabled = false;
                btn.innerText = "登入驗證";
            }
        } catch (e) { 
            alert("連線失敗"); 
            btn.disabled = false;
            btn.innerText = "登入驗證";
        }
    }

    async function loadData() {
        try {
            const res = await fetch(API_URL);
            inventoryData = await res.json();
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            renderList();
        } catch(e) { 
            alert("資料載入失敗，請檢查網路。"); 
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerText = "登入驗證";
        }
    }

    function renderList() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const list = document.getElementById('listContainer');
        list.innerHTML = '';

        if (query === '') {
            list.innerHTML = '<p style="text-align:center; color:#7f8c8d; font-size:1.1rem; padding:30px;">請在上方輸入關鍵字尋找破損的商品<br>📦 全店商品皆可搜尋</p>';
            return;
        }

        inventoryData.filter(item => {
            const text = [
                item.productId, item.productName, item.location, 
                item.purpose, item.spec, item.vendor
            ].map(s => s || '').join(' ').toLowerCase();
            return text.includes(query);
        }).forEach(item => {
            const photo = item.photo ? `<img src="${item.photo}" class="card-img">` : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;font-size:12px;">無圖</div>`;
            
            list.innerHTML += `
                <div class="card">
                    ${photo}
                    <div class="card-info">
                        <div class="sku">${item.productId || '無編號'}</div>
                        <div class="name">${item.productName || '未命名'}</div>
                        <div class="loc">📍 ${item.location || '未指定位置'}</div>
                        <div class="audit-input-group">
                            <input type="number" class="audit-input" id="broken-${item.id}" placeholder="破幾個" min="1">
                            <button class="broken-btn" id="btn-broken-${item.id}" onclick="reportBroken(${item.id})">回報扣除</button>
                        </div>
                    </div>
                </div>
            `;
        });
    }

    document.getElementById('searchInput').addEventListener('input', renderList);

    async function reportBroken(id) {
        const inputEl = document.getElementById(`broken-${id}`);
        if (inputEl.value === '' || parseInt(inputEl.value) <= 0) return alert("請輸入正確的破損數量！");
        const val = parseInt(inputEl.value);
        const item = inventoryData.find(i => i.id === id);
        
        if (!confirm(`🚨 確定要回報【${item.productName}】破損 ${val} 個嗎？\n\n這將會直接從現場庫存中扣除！`)) return;

        const btn = document.getElementById(`btn-broken-${id}`);
        btn.innerText = "處理中..."; btn.disabled = true;

        try {
            const res = await fetch(API_URL, { 
                method: 'POST', 
                headers: { 'Content-Type': 'application/json', 'X-Employee-Password': sessionStorage.getItem('empToken') }, 
                body: JSON.stringify({ action: 'reportBroken', id: id, amount: val }) 
            });
            if (res.ok) {
                alert(`✅ 回報成功！\n已將 ${item.productName} 扣除 ${val} 個。`);
                
                // 重新載入以獲取最新庫存數字
                const refreshRes = await fetch(API_URL);
                inventoryData = await refreshRes.json();
                
                inputEl.value = '';
                btn.innerText = "已回報";
                setTimeout(() => { btn.innerText = "回報扣除"; btn.disabled = false; }, 2000);
            } else { throw new Error(); }
        } catch(e) { 
            alert("回報失敗，請檢查網路"); 
            btn.innerText = "回報扣除"; btn.disabled = false; 
        }
    }
</script>

<ElicitationsGroup>
  <Elicitation label="網頁順利上線了！" query="我已經成功更新檔案，請問未來如果我想備份資料有什麼好建議嗎？"/>
  <Elicitation label="我還有其他調整想法..." query="我想要再優化一些功能細節，想問看看能不能做到..."/>
</ElicitationsGroup>
</body>
</html>
