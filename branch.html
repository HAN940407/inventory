<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>共用庫存查詢系統</title>
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #3498db; --bg-color: #f4f6f9; --zhongxiao: #27ae60; --apon: #8e44ad; --main: #d35400; }
        body { font-family: sans-serif; background-color: var(--bg-color); margin: 0; padding: 15px; color: #333; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #34495e; display: flex; align-items: center; justify-content: center; z-index: 1000; }
        .login-box { background: white; padding: 30px; border-radius: 12px; text-align: center; width: 90%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .login-input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #ddd; border-radius: 6px; font-size: 1.1rem; box-sizing: border-box; text-align: center; letter-spacing: 2px; }
        .btn { width: 100%; padding: 12px; background-color: var(--secondary-color); color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: 0.2s;}
        .btn:hover:not(:disabled) { filter: brightness(0.9); }
        
        #mainContainer { display: none; max-width: 600px; margin: 0 auto; padding-bottom: 50px;}
        .header { text-align: center; margin-bottom: 20px; }
        .search-input { width: 100%; padding: 12px; border: 2px solid var(--secondary-color); border-radius: 8px; font-size: 1rem; box-sizing: border-box; margin-bottom: 20px; outline:none;}
        
        .card { background: white; border-radius: 10px; padding: 15px; margin-bottom: 15px; box-shadow: 0 3px 6px rgba(0,0,0,0.05); }
        .card-top { display: flex; gap: 15px; margin-bottom: 15px; align-items: center;}
        .card-img { width: 70px; height: 70px; border-radius: 8px; object-fit: cover; background: #eee; }
        .card-info { flex-grow: 1; }
        .sku { font-size: 0.8rem; color: #7f8c8d; }
        .name { font-size: 1.1rem; font-weight: bold; color: var(--primary-color); margin: 3px 0; }
        .tags { font-size: 0.85rem; color: #7f8c8d; background: #eee; padding: 2px 6px; border-radius: 4px; display: inline-block; }
        
        /* 跨店庫存顯示區塊 */
        .stock-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; border-top: 1px solid #eee; padding-top: 15px;}
        .stock-item { padding: 8px 4px; border-radius: 8px; background: #f8f9fa; }
        .stock-label { font-size: 0.8rem; font-weight: bold; margin-bottom: 5px; color: #555;}
        .stock-qty { font-size: 1.2rem; font-weight: bold; }
        
        /* 各分店專屬顏色 */
        .main-store .stock-label { color: var(--main); }
        .main-store .stock-qty { color: var(--main); }
        .zx-store .stock-label { color: var(--zhongxiao); }
        .zx-store .stock-qty { color: var(--zhongxiao); }
        .ap-store .stock-label { color: var(--apon); }
        .ap-store .stock-qty { color: var(--apon); }
        
        .total-banner { background: #34495e; color: white; text-align: center; padding: 6px; border-radius: 6px; font-size: 0.9rem; font-weight: bold; margin-top: 10px;}
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2 style="color:#2c3e50; margin-top:0;">🤝 共用庫存查詢</h2>
        <input type="password" id="passwordInput" class="login-input" placeholder="查詢授權碼">
        <button class="btn" id="loginBtn" onclick="checkPassword()">登入系統</button>
        <p id="errorMsg" style="color:red; display:none; font-size:0.9rem; font-weight:bold;">密碼錯誤</p>
    </div>
</div>

<div id="mainContainer">
    <div class="header">
        <h2 style="color:var(--secondary-color); margin-bottom:5px;">🤝 跨店共用庫存查詢網</h2>
        <p style="color:#7f8c8d; font-size:0.9rem; margin-top:0;">即時查看共用倉庫餘裕與各店領用狀況</p>
        <input type="text" id="searchInput" class="search-input" placeholder="🔍 搜尋品名、用途、編號...">
    </div>
    <div id="listContainer"></div>
</div>

<script>
    const API_URL = 'https://inventory-api.108m09101f.workers.dev'; 
    let inventoryData = [];

    async function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.innerText = "驗證中...";
        document.getElementById('errorMsg').style.display = 'none';

        try {
            // 與員工盤點系統共用一組密碼，方便統一管理
            const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Employee-Password': input }, body: JSON.stringify({ action: 'login_emp' }) });
            if (res.ok) { 
                sessionStorage.setItem('branchToken', input); 
                btn.innerText = "下載資料中 📦..."; 
                await loadData(); 
            } else { 
                document.getElementById('errorMsg').style.display = 'block'; 
                btn.disabled = false;
                btn.innerText = "登入系統";
            }
        } catch (e) { 
            alert("連線失敗"); 
            btn.disabled = false;
            btn.innerText = "登入系統";
        }
    }

    async function loadData() {
        try {
            const res = await fetch(API_URL);
            inventoryData = await res.json();
            
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('mainContainer').style.display = 'block';
            renderList();
        } catch(e) { 
            alert("資料載入失敗，請檢查網路。"); 
            document.getElementById('loginBtn').disabled = false;
            document.getElementById('loginBtn').innerText = "登入系統";
        }
    }

    function renderList() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const list = document.getElementById('listContainer');
        list.innerHTML = '';

        const displayItems = inventoryData.filter(item => {
            if (!query) return true;
            const text = [
                item.productId, item.productName, item.purpose, item.spec, item.vendor
            ].map(s => s || '').join(' ').toLowerCase();
            return text.includes(query);
        });

        if (displayItems.length === 0) {
            list.innerHTML = '<p style="text-align:center; color:#7f8c8d; padding:30px;">找不到符合的商品。</p>';
            return;
        }

        displayItems.forEach(item => {
            const photo = item.photo ? `<img src="${item.photo}" class="card-img">` : `<div class="card-img" style="display:flex;align-items:center;justify-content:center;font-size:12px;color:#999;">無圖</div>`;
            const purposeTag = item.purpose ? `<span class="tags">${item.purpose}</span>` : '';
            
            // 💡 將原本的「總部」邏輯改名為「共用倉庫 (可調度)」
            const sharedQty = (item.quantityOnsite || 0) + (item.quantity || 0); 
            const zxQty = item.borrowZhongxiao || 0;
            const apQty = item.borrowApon || 0;
            const totalQty = sharedQty + zxQty + apQty + (item.borrowOther || 0);

            list.innerHTML += `
                <div class="card">
                    <div class="card-top">
                        ${photo}
                        <div class="card-info">
                            <div class="sku">${item.productId || '無編號'}</div>
                            <div class="name">${item.productName || '未命名'}</div>
                            ${purposeTag}
                        </div>
                    </div>
                    
                    <div class="stock-grid">
                        <div class="stock-item main-store">
                            <div class="stock-label">📦 共用倉庫<br>(可調度)</div>
                            <div class="stock-qty">${sharedQty}</div>
                        </div>
                        <div class="stock-item zx-store">
                            <div class="stock-label">📍 忠孝店<br>(已領用)</div>
                            <div class="stock-qty">${zxQty}</div>
                        </div>
                        <div class="stock-item ap-store">
                            <div class="stock-label">📍 艾朋店<br>(已領用)</div>
                            <div class="stock-qty">${apQty}</div>
                        </div>
                    </div>
                    <div class="total-banner">所有店總資產：${totalQty} 件</div>
                </div>
            `;
        });
    }

    document.getElementById('searchInput').addEventListener('input', renderList);

    if (sessionStorage.getItem('branchToken')) { loadData(); }
</script>
</body>
</html>
