<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端庫存管理系統</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --secondary-color: #3498db;
            --background-color: #f8f9fa;
            --border-color: #dee2e6;
            --edit-color: #f39c12;
            --cancel-color: #95a5a6;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background-color); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1300px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 30px; }
        .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; transition: all 0.3s ease;}
        /* 編輯模式時的邊框特效 */
        .card.edit-mode { border: 2px solid var(--edit-color); box-shadow: 0 0 15px rgba(243, 156, 18, 0.2); }
        .card-title { margin-top: 0; margin-bottom: 20px; color: var(--primary-color); font-size: 1.2rem; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #555; }
        .form-group input, .form-group select { padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; font-size: 1rem; transition: border-color 0.3s; }
        .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--secondary-color); }
        .form-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
        
        /* 按鈕樣式設定 */
        .btn { padding: 10px 20px; background-color: var(--secondary-color); color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .btn:hover { background-color: #2980b9; }
        .btn:disabled { background-color: #95a5a6; cursor: not-allowed; }
        .btn-danger { background-color: #e74c3c; padding: 6px 12px; font-size: 0.9rem; }
        .btn-danger:hover { background-color: #c0392b; }
        .btn-edit { background-color: var(--edit-color); padding: 6px 12px; font-size: 0.9rem; }
        .btn-edit:hover { background-color: #d68910; }
        .btn-cancel { background-color: var(--cancel-color); display: none; }
        .btn-cancel:hover { background-color: #7f8c8d; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background-color: #f1f3f5; color: var(--primary-color); font-weight: 600; }
        tr:hover { background-color: #f8f9fa; }
        .item-photo { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        .empty-state { text-align: center; padding: 30px; color: #777; font-style: italic; }
        .action-buttons { display: flex; gap: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>☁️ 雲端庫存管理系統</h1>

    <div class="card" id="formCard">
        <h2 class="card-title" id="formTitle">新增進貨/庫存</h2>
        <form id="inventoryForm">
            <div class="form-grid">
                <div class="form-group">
                    <label for="photo">上傳新照片 (編輯時若不改請留空)</label>
                    <input type="file" id="photo" accept="image/*">
                </div>
                <div class="form-group">
                    <label for="orderId">訂購編號</label>
                    <input type="text" id="orderId" placeholder="例如: PO-20231001" required>
                </div>
                <div class="form-group">
                    <label for="productId">產品編號 (SKU)</label>
                    <input type="text" id="productId" placeholder="例如: A001" required>
                </div>
                <div class="form-group">
                    <label for="productName">品名</label>
                    <input type="text" id="productName" placeholder="輸入產品名稱" required>
                </div>
                <div class="form-group">
                    <label for="spec">規格</label>
                    <input type="text" id="spec" placeholder="尺寸、重量、顏色等">
                </div>
                <div class="form-group">
                    <label for="vendor">廠商</label>
                    <input type="text" id="vendor" placeholder="供應商名稱">
                </div>
                <div class="form-group">
                    <label for="purpose">用途</label>
                    <input type="text" id="purpose" placeholder="所屬專案或部門">
                </div>
                <div class="form-group">
                    <label for="location">存放位置</label>
                    <input type="text" id="location" placeholder="例如: 倉庫A、第3排貨架">
                </div>
                <div class="form-group">
                    <label for="price">單價 (NT$)</label>
                    <input type="number" id="price" min="0" step="0.1" value="0" required>
                </div>
                <div class="form-group">
                    <label for="quantity">數量</label>
                    <input type="number" id="quantity" min="0" value="1" required>
                </div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-cancel" id="cancelEditBtn" onclick="cancelEdit()">取消編輯</button>
                <button type="submit" class="btn" id="submitBtn">新增至庫存</button>
            </div>
        </form>
    </div>

    <div class="card">
        <h2 class="card-title">目前庫存總覽</h2>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>照片</th>
                        <th>訂購編號</th>
                        <th>產品編號</th>
                        <th>品名</th>
                        <th>規格</th>
                        <th>廠商</th>
                        <th>用途</th>
                        <th>存放位置</th>
                        <th>單價</th>
                        <th>數量</th>
                        <th>總價</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody">
                    <!-- 資料動態產生處 -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const form = document.getElementById('inventoryForm');
    const tableBody = document.getElementById('inventoryTableBody');
    const formCard = document.getElementById('formCard');
    const formTitle = document.getElementById('formTitle');
    const submitBtn = document.getElementById('submitBtn');
    const cancelEditBtn = document.getElementById('cancelEditBtn');
    
    const API_URL = 'https://inventory-api.108m09101f.workers.dev'; 
    
    let inventoryData = [];
    let editingId = null; // 💡 追蹤目前正在編輯哪一筆資料
    let currentOriginalPhoto = ''; // 💡 儲存編輯前的原始照片，如果沒上傳新照片就沿用

    loadData();

    async function loadData() {
        try {
            tableBody.innerHTML = '<tr><td colspan="12" style="text-align:center;">資料從 Cloudflare 載入中... ☁️</td></tr>';
            const response = await fetch(API_URL);
            if (!response.ok) throw new Error('API 回應錯誤');
            inventoryData = await response.json();
            renderTable();
        } catch (error) {
            console.error('載入失敗:', error);
            tableBody.innerHTML = '<tr><td colspan="12" style="text-align:center;color:red;">連線失敗！請確認 API 網址是否正確。</td></tr>';
        }
    }

    // 💡 點擊「編輯」按鈕觸發的函式
    function startEdit(id) {
        // 從資料中找出被點擊的該筆資料
        const item = inventoryData.find(i => i.id === id);
        if(!item) return;

        editingId = id;
        currentOriginalPhoto = item.photo || ''; // 保留原照片記錄

        // 將資料填入上方的表單
        document.getElementById('orderId').value = item.orderId || '';
        document.getElementById('productId').value = item.productId || '';
        document.getElementById('productName').value = item.productName || '';
        document.getElementById('spec').value = item.spec || '';
        document.getElementById('vendor').value = item.vendor || '';
        document.getElementById('purpose').value = item.purpose || '';
        document.getElementById('location').value = item.location || '';
        document.getElementById('price').value = item.price || 0;
        document.getElementById('quantity').value = item.quantity || 0;
        document.getElementById('photo').value = ''; // 清空檔案選擇器

        // 改變表單外觀與按鈕
        formCard.classList.add('edit-mode');
        formTitle.innerText = `✏️ 正在編輯資料 (產品編號: ${item.productId})`;
        submitBtn.innerText = '儲存更新';
        submitBtn.style.backgroundColor = 'var(--edit-color)';
        cancelEditBtn.style.display = 'block'; // 顯示取消按鈕

        // 畫面捲動到最上方方便編輯
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 💡 取消編輯
    function cancelEdit() {
        editingId = null;
        currentOriginalPhoto = '';
        form.reset();
        
        formCard.classList.remove('edit-mode');
        formTitle.innerText = '新增進貨/庫存';
        submitBtn.innerText = '新增至庫存';
        submitBtn.style.backgroundColor = 'var(--secondary-color)';
        cancelEditBtn.style.display = 'none';
    }

    // 表單送出 (現在會自動判斷是「新增」還是「更新」)
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const photoInput = document.getElementById('photo');
        
        const itemData = {
            id: editingId ? editingId : Date.now(), // 如果是編輯模式就用原本的ID，否則產生新ID
            orderId: document.getElementById('orderId').value,
            productId: document.getElementById('productId').value,
            productName: document.getElementById('productName').value,
            spec: document.getElementById('spec').value,
            vendor: document.getElementById('vendor').value,
            purpose: document.getElementById('purpose').value,
            location: document.getElementById('location').value,
            price: parseFloat(document.getElementById('price').value) || 0,
            quantity: parseInt(document.getElementById('quantity').value) || 0,
        };
        itemData.totalPrice = itemData.price * itemData.quantity;

        // 照片處理邏輯
        if (photoInput.files && photoInput.files[0]) {
            // 如果有上傳新照片
            const reader = new FileReader();
            reader.onload = function(event) {
                itemData.photo = event.target.result; 
                saveToServer(itemData);
            };
            reader.readAsDataURL(photoInput.files[0]);
        } else {
            // 如果沒有上傳新照片：若為編輯模式則沿用舊照片，若為新增則為空字串
            itemData.photo = editingId ? currentOriginalPhoto : '';
            saveToServer(itemData);
        }
    });

    // 儲存至雲端 (支援 POST 新增 與 PUT 更新)
    async function saveToServer(itemData) {
        const isEditing = editingId !== null;
        
        try {
            submitBtn.innerText = '雲端同步中...';
            submitBtn.disabled = true;

            const response = await fetch(API_URL, {
                method: isEditing ? 'PUT' : 'POST', // 💡 依據模式決定呼叫的方法
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(itemData)
            });
            
            if (!response.ok) throw new Error('儲存失敗');
            
            cancelEdit(); // 成功後清除表單並退出編輯模式
            await loadData();
        } catch (error) {
            console.error(error);
            alert('儲存失敗，請檢查網路連線或 API 設定');
            submitBtn.innerText = isEditing ? '儲存更新' : '新增至庫存';
            submitBtn.disabled = false;
        }
    }

    async function deleteItem(id) {
        if(confirm('確定要從雲端資料庫徹底刪除這筆資料嗎？')) {
            try {
                event.target.innerText = '刪除中...';
                event.target.disabled = true;
                const response = await fetch(`${API_URL}?id=${id}`, { method: 'DELETE' });
                if (!response.ok) throw new Error('刪除失敗');
                
                // 如果刪除的剛好是正在編輯的資料，就取消編輯狀態
                if (id === editingId) cancelEdit();
                
                await loadData(); 
            } catch (error) {
                console.error(error);
                alert('刪除失敗');
                await loadData(); 
            }
        }
    }

    function renderTable() {
        tableBody.innerHTML = '';
        if (inventoryData.length === 0) {
            tableBody.innerHTML = '<tr><td colspan="12" class="empty-state">目前資料庫是空的。請在上方新增你的第一筆庫存！</td></tr>';
            return;
        }
        
        inventoryData.forEach(item => {
            const row = document.createElement('tr');
            const photoHtml = item.photo 
                ? `<img src="${item.photo}" alt="照片" class="item-photo">` 
                : `<div class="item-photo" style="display:flex;align-items:center;justify-content:center;background:#eee;color:#999;font-size:12px;">無圖片</div>`;
            const formatMoney = (num) => '$' + num.toLocaleString();

            row.innerHTML = `
                <td>${photoHtml}</td>
                <td>${item.orderId || ''}</td>
                <td><strong>${item.productId || ''}</strong></td>
                <td>${item.productName || ''}</td>
                <td>${item.spec || ''}</td>
                <td>${item.vendor || ''}</td>
                <td>${item.purpose || ''}</td>
                <td>${item.location || ''}</td>
                <td>${formatMoney(item.price)}</td>
                <td>${item.quantity}</td>
                <td><strong>${formatMoney(item.totalPrice)}</strong></td>
                <td>
                    <div class="action-buttons">
                        <!-- 💡 新增的編輯按鈕 -->
                        <button class="btn btn-edit" onclick="startEdit(${item.id})">編輯</button>
                        <button class="btn btn-danger" onclick="deleteItem(${item.id})">刪除</button>
                    </div>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }
</script>

</body>
</html>
