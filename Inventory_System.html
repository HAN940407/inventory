<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雲端庫存管理系統 (後台)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 💡 引入強大的 SortableJS 拖拉套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>
    
    <style>
        :root { --primary-color: #2c3e50; --secondary-color: #3498db; --background-color: #f8f9fa; --border-color: #dee2e6; --edit-color: #f39c12; --cancel-color: #95a5a6; --import-color: #27ae60; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--background-color); margin: 0; padding: 20px; color: #333; }
        #loginScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #2c3e50, #3498db); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); text-align: center; width: 100%; max-width: 350px; }
        .login-box h2 { color: var(--primary-color); margin-top: 0; margin-bottom: 25px; }
        .login-input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid var(--border-color); border-radius: 6px; font-size: 1.1rem; outline: none; text-align: center; letter-spacing: 2px; }
        .login-btn { width: 100%; padding: 12px; background-color: var(--primary-color); color: white; border: none; border-radius: 6px; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .error-msg { color: #e74c3c; margin-top: 15px; font-size: 0.9rem; display: none; font-weight: bold; }
        #mainContainer { display: none; max-width: 1350px; margin: 0 auto; position: relative; }
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        h1 { color: var(--primary-color); margin-bottom: 10px; }
        .btn-group-top { position: absolute; top: 0; right: 0; display: flex; gap: 10px; }
        .front-btn { background-color: #27ae60; color: white; padding: 8px 16px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 0.95rem; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; cursor: pointer; }
        .logout-btn { background-color: #e74c3c; }
        .card { background: white; border-radius: 10px; padding: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 30px; }
        .card.edit-mode { border: 2px solid var(--edit-color); box-shadow: 0 0 15px rgba(243, 156, 18, 0.2); }
        .dashboard-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 25px; }
        .stat-box { background: linear-gradient(135deg, var(--secondary-color), #2980b9); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        .stat-box.green { background: linear-gradient(135deg, #27ae60, #2ecc71); }
        .stat-box.orange { background: linear-gradient(135deg, #e67e22, #f39c12); }
        .stat-title { font-size: 1rem; font-weight: 600; margin-bottom: 10px; opacity: 0.9; }
        .stat-value { font-size: 2rem; font-weight: bold; margin: 0; }
        .charts-container { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .chart-box { background: #f8f9fa; padding: 15px; border-radius: 8px; border: 1px solid var(--border-color); height: 300px; }
        .header-actions { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border-color); padding-bottom: 10px; margin-bottom: 20px;}
        .card-title { margin: 0; color: var(--primary-color); font-size: 1.2rem; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; color: #555; }
        .form-group input { padding: 10px; border: 1px solid var(--border-color); border-radius: 5px; font-size: 1rem; }
        .form-actions { margin-top: 20px; display: flex; justify-content: flex-end; gap: 10px; }
        .btn { padding: 8px 16px; background-color: var(--secondary-color); color: white; border: none; border-radius: 5px; font-size: 1rem; cursor: pointer; font-weight: 600; }
        .btn-danger { background-color: #e74c3c; padding: 6px 12px; font-size: 0.9rem; }
        .btn-edit { background-color: var(--edit-color); padding: 6px 12px; font-size: 0.9rem; }
        .btn-cancel { background-color: var(--cancel-color); display: none; }
        .btn-import { background-color: var(--import-color); }
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; white-space: nowrap; }
        th, td { padding: 12px 10px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: middle; }
        th { background-color: #f1f3f5; color: var(--primary-color); font-weight: 600; font-size: 0.95rem; }
        tr:hover { background-color: #f8f9fa; }
        .row-checkbox, #selectAll { transform: scale(1.3); cursor: pointer; }
        .item-photo { width: 60px; height: 60px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; }
        
        /* 💡 拖拉手把的樣式 */
        .drag-handle { cursor: grab; font-size: 1.5rem; color: #bdc3c7; text-align: center; }
        .drag-handle:active { cursor: grabbing; color: var(--secondary-color); }
        /* 拖曳時整行的特效 */
        .sortable-ghost { background-color: #eaf2f8 !important; opacity: 0.8; }
        
        .qty-hl { color: var(--secondary-color); font-weight: bold; }
        .qty-total { color: #e67e22; font-weight: bold; font-size: 1.05rem; }
        #saveOrderBtn { background-color: #f39c12; display: none; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

<div id="loginScreen">
    <div class="login-box">
        <h2>🔒 後台管理系統</h2>
        <p style="color:#7f8c8d; margin-bottom:20px; font-size:0.9rem;">請輸入管理員密碼以進入系統</p>
        <input type="password" id="passwordInput" class="login-input" placeholder="輸入密碼" onkeypress="handleEnter(event)">
        <button class="login-btn" onclick="checkPassword()">登入</button>
        <div id="errorMsg" class="error-msg">密碼錯誤，請重新輸入！</div>
        <a href="index.html" style="display:block; margin-top:20px; color:var(--secondary-color); text-decoration:none; font-size:0.9rem;">👈 返回前台型錄</a>
    </div>
</div>

<div id="mainContainer" class="container">
    <div class="header">
        <div class="btn-group-top">
            <a href="index.html" class="front-btn">📱 前往型錄展示</a>
            <button onclick="logout()" class="front-btn logout-btn">🚪 登出</button>
        </div>
        <h1>☁️ 雲端庫存管理系統 (後台)</h1>
    </div>

    <!-- 儀表板 (省略部分 HTML 保持版面整潔，功能完全一致) -->
    <div class="card" id="dashboardCard" style="display: none;">
        <h2 class="card-title" style="margin-bottom: 20px;">📊 庫存數據分析</h2>
        <div class="dashboard-grid">
            <div class="stat-box green"><div class="stat-title">總庫存價值 (NT$)</div><div class="stat-value" id="statTotalValue">$0</div></div>
            <div class="stat-box"><div class="stat-title">總產品品項 (SKU)</div><div class="stat-value" id="statTotalSKU">0</div></div>
            <div class="stat-box orange"><div class="stat-title">總計件數 (現場+倉庫)</div><div class="stat-value" id="statTotalQty">0</div></div>
        </div>
        <div class="charts-container">
            <div class="chart-box"><canvas id="vendorChart"></canvas></div>
            <div class="chart-box"><canvas id="valueChart"></canvas></div>
        </div>
    </div>

    <!-- 表單區塊 -->
    <div class="card" id="formCard">
        <h2 class="card-title" id="formTitle" style="margin-bottom: 20px;">新增進貨/庫存</h2>
        <form id="inventoryForm">
            <div class="form-grid">
                <div class="form-group"><label for="photo">上傳照片</label><input type="file" id="photo" accept="image/*"></div>
                <div class="form-group"><label for="orderId">訂購編號</label><input type="text" id="orderId" required></div>
                <div class="form-group"><label for="productId">產品編號 (SKU)</label><input type="text" id="productId" required></div>
                <div class="form-group"><label for="productName">品名</label><input type="text" id="productName" required></div>
                <div class="form-group"><label for="spec">規格</label><input type="text" id="spec"></div>
                <div class="form-group"><label for="vendor">廠商</label><input type="text" id="vendor"></div>
                <div class="form-group"><label for="purpose">用途</label><input type="text" id="purpose"></div>
                <div class="form-group"><label for="location">存放位置</label><input type="text" id="location"></div>
                <div class="form-group"><label for="price">單價 (NT$)</label><input type="number" id="price" min="0" step="0.1" value="0" required></div>
                <div class="form-group"><label for="quantityOnsite" style="color:var(--secondary-color);">現場庫存數量</label><input type="number" id="quantityOnsite" min="0" value="0" required></div>
                <div class="form-group"><label for="quantity">倉庫庫存數量</label><input type="number" id="quantity" min="0" value="0" required></div>
            </div>
            <div class="form-actions">
                <button type="button" class="btn btn-cancel" id="cancelEditBtn" onclick="cancelEdit()">取消編輯</button>
                <button type="submit" class="btn" id="submitBtn">新增至庫存</button>
            </div>
        </form>
    </div>

    <!-- 列表區塊 -->
    <div class="card">
        <div class="header-actions">
            <h2 class="card-title">目前庫存總覽</h2>
            <div style="display: flex; gap: 10px; align-items: center;">
                <!-- 💡 顯示儲存排序中的按鈕 -->
                <button class="btn" id="saveOrderBtn">🔄 正在儲存排序...</button>
                <button class="btn btn-danger" id="batchDeleteBtn" style="display:none;" onclick="batchDelete()">🗑️ 批量刪除</button>
                <button class="btn btn-cancel" style="display:inline-block; background-color:#7f8c8d;" onclick="downloadTemplate()">📄 下載 CSV 範本</button>
                <input type="file" id="csvFileInput" accept=".csv" style="display: none;">
                <button class="btn btn-import" onclick="document.getElementById('csvFileInput').click()">📥 一鍵導入 CSV</button>
            </div>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <!-- 💡 表頭加入排序欄位 -->
                        <th style="width: 40px; text-align: center;">排序</th>
                        <th style="width: 40px; text-align: center;"><input type="checkbox" id="selectAll" onclick="toggleSelectAll()"></th>
                        <th>照片</th><th>產品編號</th><th>品名</th><th>廠商</th>
                        <th>存放位置</th><th>單價</th><th>現場</th><th>倉庫</th><th style="color:#e67e22;">總庫存</th><th>總價</th><th>操作</th>
                    </tr>
                </thead>
                <tbody id="inventoryTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const API_URL = 'https://inventory-api.108m09101f.workers.dev'; 

    let inventoryData = [];
    let editingId = null; 
    let currentOriginalPhoto = ''; 
    const form = document.getElementById('inventoryForm');
    const tableBody = document.getElementById('inventoryTableBody');
    let vendorChartInstance = null; 
    let valueChartInstance = null;
    let sortableInstance = null; // 💡 存放拖拉實例

    if (sessionStorage.getItem('adminToken')) { showMainSystem(); }

    async function checkPassword() {
        const input = document.getElementById('passwordInput').value;
        const btn = document.querySelector('.login-btn');
        const errorMsg = document.getElementById('errorMsg');
        btn.innerText = '驗證中...'; btn.disabled = true; errorMsg.style.display = 'none';
        try {
            const response = await fetch(API_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Admin-Password': input },
                body: JSON.stringify({ action: 'login' })
            });
            if (response.ok) { sessionStorage.setItem('adminToken', input); showMainSystem(); } 
            else { errorMsg.style.display = 'block'; document.getElementById('passwordInput').value = ''; }
        } catch (error) { alert('連線失敗，請檢查網路'); } 
        finally { btn.innerText = '登入'; btn.disabled = false; }
    }

    function handleEnter(e) { if (e.key === 'Enter') checkPassword(); }
    function showMainSystem() { document.getElementById('loginScreen').style.display = 'none'; document.getElementById('mainContainer').style.display = 'block'; loadData(); }
    function logout() { sessionStorage.removeItem('adminToken'); location.reload(); }
    function getAuthHeaders() { return { 'Content-Type': 'application/json', 'X-Admin-Password': sessionStorage.getItem('adminToken') }; }

    async function loadData() {
        tableBody.innerHTML = '<tr><td colspan="14" style="text-align:center;">載入中... ☁️</td></tr>';
        try {
            const res = await fetch(API_URL); inventoryData = await res.json();
            renderTable(); renderDashboard(); 
            document.getElementById('selectAll').checked = false; updateBatchDeleteBtn();
        } catch (error) { tableBody.innerHTML = '<tr><td colspan="14" style="text-align:center;color:red;">連線失敗</td></tr>'; }
    }

    function renderTable() {
        tableBody.innerHTML = '';
        if (inventoryData.length === 0) return tableBody.innerHTML = '<tr><td colspan="14" class="empty-state">目前為空</td></tr>';
        
        inventoryData.forEach(item => {
            const tr = document.createElement('tr');
            // 💡 賦予 TR 特定的 ID，方便拖拉後抓取順序
            tr.setAttribute('data-id', item.id);
            const photo = item.photo ? `<img src="${item.photo}" class="item-photo">` : `<div class="item-photo" style="display:flex;align-items:center;justify-content:center;background:#eee;font-size:12px;">無</div>`;
            const fm = n => '$' + n.toLocaleString();
            const qTotal = (item.quantityOnsite || 0) + (item.quantity || 0);
            
            // 💡 第一欄加入拖拉手把 `☰`
            tr.innerHTML = `
                <td class="drag-handle">☰</td>
                <td style="text-align: center;"><input type="checkbox" class="row-checkbox" value="${item.id}" onclick="updateBatchDeleteBtn()"></td>
                <td>${photo}</td><td><strong>${item.productId||''}</strong></td>
                <td>${item.productName||''}</td><td>${item.vendor||''}</td><td>${item.location||''}</td>
                <td>${fm(item.price)}</td>
                <td class="qty-hl">${item.quantityOnsite || 0}</td>
                <td class="qty-hl">${item.quantity || 0}</td>
                <td class="qty-total">${qTotal}</td>
                <td><strong>${fm((item.price||0)*qTotal)}</strong></td>
                <td><div class="action-buttons"><button class="btn btn-edit" onclick="startEdit(${item.id})">編輯</button><button class="btn btn-danger" onclick="deleteItem(${item.id})">刪除</button></div></td>`;
            tableBody.appendChild(tr);
        });

        // 💡 啟動 Sortable 拖拉功能
        initSortable();
    }

    // 💡 拖拉核心邏輯
    function initSortable() {
        if (sortableInstance) sortableInstance.destroy(); // 避免重複綁定
        sortableInstance = new Sortable(tableBody, {
            handle: '.drag-handle', // 只有點擊 ☰ 才能拖拉
            animation: 150,
            ghostClass: 'sortable-ghost',
            onEnd: async function () {
                // 放開滑鼠時，收集目前畫面上所有 TR 的新順序
                const rows = tableBody.querySelectorAll('tr[data-id]');
                const newOrderList = [];
                rows.forEach((row, index) => {
                    newOrderList.push({ id: parseInt(row.getAttribute('data-id')), sortOrder: index + 1 });
                });

                // 發送給伺服器儲存
                const saveBtn = document.getElementById('saveOrderBtn');
                saveBtn.style.display = 'inline-block';
                
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        headers: getAuthHeaders(),
                        body: JSON.stringify({ action: 'reorder', items: newOrderList })
                    });
                    if(!res.ok) throw new Error();
                } catch(e) {
                    alert("儲存排序失敗，可能網路不穩或未授權");
                } finally {
                    saveBtn.style.display = 'none';
                    // 為了確保資料同步，最好重新 loadData 一次 (背景偷偷載)
                    fetch(API_URL).then(r=>r.json()).then(d => inventoryData = d);
                }
            }
        });
    }

    // 儀表板、新增、編輯、刪除的邏輯完全保持原樣...
    function renderDashboard() {
        if (inventoryData.length === 0) { document.getElementById('dashboardCard').style.display = 'none'; return; }
        document.getElementById('dashboardCard').style.display = 'block';
        let totalValue = 0; let totalQty = 0; let vendorCounts = {};
        inventoryData.forEach(item => {
            const sumQty = (item.quantityOnsite || 0) + (item.quantity || 0); 
            totalValue += (item.price || 0) * sumQty; totalQty += sumQty;
            const vendor = item.vendor || '未登記廠商'; vendorCounts[vendor] = (vendorCounts[vendor] || 0) + 1;
        });
        document.getElementById('statTotalValue').innerText = '$' + totalValue.toLocaleString();
        document.getElementById('statTotalSKU').innerText = inventoryData.length.toLocaleString();
        document.getElementById('statTotalQty').innerText = totalQty.toLocaleString();
        const ctxVendor = document.getElementById('vendorChart').getContext('2d');
        if (vendorChartInstance) vendorChartInstance.destroy(); 
        vendorChartInstance = new Chart(ctxVendor, { type: 'doughnut', data: { labels: Object.keys(vendorCounts), datasets: [{ data: Object.values(vendorCounts), backgroundColor: ['#3498db', '#e74c3c', '#f1c40f', '#2ecc71', '#9b59b6', '#34495e', '#e67e22'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false } });
        const topItems = [...inventoryData].map(i => ({...i, total: (i.price||0)*((i.quantity||0)+(i.quantityOnsite||0))})).sort((a, b) => b.total - a.total).slice(0, 5);
        const ctxValue = document.getElementById('valueChart').getContext('2d');
        if (valueChartInstance) valueChartInstance.destroy(); 
        valueChartInstance = new Chart(ctxValue, { type: 'bar', data: { labels: topItems.map(i => i.productName || i.productId), datasets: [{ label: '庫存總價值', data: topItems.map(i => i.total), backgroundColor: '#27ae60', borderRadius: 5 }] }, options: { responsive: true, maintainAspectRatio: false } });
    }

    form.addEventListener('submit', function(e) {
        e.preventDefault();
        const photoInput = document.getElementById('photo');
        const pPrice = parseFloat(document.getElementById('price').value) || 0;
        const qOnsite = parseInt(document.getElementById('quantityOnsite').value) || 0;
        const qWarehouse = parseInt(document.getElementById('quantity').value) || 0;
        const itemData = {
            id: editingId ? editingId : Date.now(),
            orderId: document.getElementById('orderId').value, productId: document.getElementById('productId').value,
            productName: document.getElementById('productName').value, spec: document.getElementById('spec').value,
            vendor: document.getElementById('vendor').value, purpose: document.getElementById('purpose').value,
            location: document.getElementById('location').value, price: pPrice,
            quantityOnsite: qOnsite, quantity: qWarehouse, totalPrice: pPrice * (qOnsite + qWarehouse)
        };
        if (photoInput.files && photoInput.files[0]) {
            const reader = new FileReader();
            reader.onload = e => { itemData.photo = e.target.result; saveToServer(itemData); };
            reader.readAsDataURL(photoInput.files[0]);
        } else { itemData.photo = editingId ? currentOriginalPhoto : ''; saveToServer(itemData); }
    });

    async function saveToServer(itemData) {
        try {
            await fetch(API_URL, { method: editingId ? 'PUT' : 'POST', headers: getAuthHeaders(), body: JSON.stringify(itemData) });
            cancelEdit(); await loadData();
        } catch (err) { alert('儲存失敗'); }
    }

    async function deleteItem(id) {
        if(confirm('確定刪除？')) {
            await fetch(`${API_URL}?id=${id}`, { method: 'DELETE', headers: { 'X-Admin-Password': sessionStorage.getItem('adminToken') } });
            if (id === editingId) cancelEdit(); await loadData(); 
        }
    }

    function startEdit(id) {
        const item = inventoryData.find(i => i.id === id); if(!item) return;
        editingId = id; currentOriginalPhoto = item.photo || '';
        document.getElementById('orderId').value = item.orderId || ''; document.getElementById('productId').value = item.productId || '';
        document.getElementById('productName').value = item.productName || ''; document.getElementById('spec').value = item.spec || '';
        document.getElementById('vendor').value = item.vendor || ''; document.getElementById('purpose').value = item.purpose || '';
        document.getElementById('location').value = item.location || ''; document.getElementById('price').value = item.price || 0;
        document.getElementById('quantityOnsite').value = item.quantityOnsite || 0; document.getElementById('quantity').value = item.quantity || 0;
        document.getElementById('formCard').classList.add('edit-mode'); document.getElementById('formTitle').innerText = `✏️ 編輯資料`;
        document.getElementById('cancelEditBtn').style.display = 'block'; window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    function cancelEdit() { editingId = null; currentOriginalPhoto = ''; form.reset(); document.getElementById('formCard').classList.remove('edit-mode'); document.getElementById('formTitle').innerText = '新增進貨/庫存'; document.getElementById('cancelEditBtn').style.display = 'none'; }
    function toggleSelectAll() { const s=document.getElementById('selectAll'); document.querySelectorAll('.row-checkbox').forEach(cb=>cb.checked=s.checked); updateBatchDeleteBtn(); }
    function updateBatchDeleteBtn() { const c=document.querySelectorAll('.row-checkbox:checked').length; const btn=document.getElementById('batchDeleteBtn'); btn.style.display=c>0?'inline-block':'none'; if(c>0)btn.innerText=`🗑️ 批量刪除 (${c})`; }
    async function batchDelete() { const cb=document.querySelectorAll('.row-checkbox:checked'); const ids=Array.from(cb).map(c=>c.value); if(ids.length===0)return; if(confirm(`確定刪除 ${ids.length} 筆資料嗎？`)){ document.getElementById('batchDeleteBtn').innerText='刪除中...'; await Promise.all(ids.map(id=>fetch(`${API_URL}?id=${id}`,{method:'DELETE',headers:getAuthHeaders()}))); await loadData(); } }
</script>
</body>
</html>
